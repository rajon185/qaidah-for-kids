apply plugin: 'com.android.application'

android {
    namespace = "io.github.rajon185.qaidah"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.rajon185.qaidah"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Set by the release workflow from the git tag (v1.2.3 -> versionName 1.2.3).
        versionCode((project.findProperty('versionCode') ?: '1') as Integer)
        versionName(project.findProperty('versionName') ?: '0.0.0-dev')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing comes from environment variables (GitHub secrets in CI).
    // Without them, the release build falls back to the debug key so it can still be installed for testing.
    def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    def hasReleaseKey = keystorePath && file(keystorePath).exists()
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Copy the latest web app (index.html, js/, styles.css, ...) into the APK on every build, so
// pressing Run in Android Studio never ships stale files. This is `cap copy`, not `cap sync`:
// sync also rewrites Gradle files, which must not happen mid-build. After adding or removing a
// Capacitor plugin, still run `npm run android:sync` once. Skip with -PskipWebCopy.
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def npx = isWindows ? ['cmd', '/c', 'npx'] : ['npx']
def npm = isWindows ? ['cmd', '/c', 'npm'] : ['npm']
interface InjectedExecOps { @javax.inject.Inject ExecOperations getExecOps() }
def execOps = project.objects.newInstance(InjectedExecOps).execOps
def webRoot = rootProject.projectDir.parentFile
tasks.register('copyWebApp') {
    group = 'capacitor'
    description = 'Builds www/ and copies it into the Android assets'
    onlyIf { !project.hasProperty('skipWebCopy') }
    doLast {
        execOps.exec { workingDir = webRoot; commandLine(npm + ['run', 'build:web']) }
        execOps.exec { workingDir = webRoot; commandLine(npx + ['cap', 'copy', 'android']) }
    }
}
tasks.named('preBuild') { dependsOn 'copyWebApp' }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
