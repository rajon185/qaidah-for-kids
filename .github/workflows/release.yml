name: Release

# Pushing a tag like v1.2.3 (on main), or publishing a release with a new tag on GitHub's
# Releases page, builds a release APK and attaches it to the GitHub Release.
# See RELEASING.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main. Release from main only (see RELEASING.md)."
            exit 1
          fi

      - name: Work out version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          # versionCode must always increase: 1.2.3 -> 10203
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (code $CODE)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync into Android project
        run: npm run android:sync

      - name: Restore signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set. The APK will be signed with a debug key (fine for testing, not for the Play Store)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PversionName="${{ steps.version.outputs.name }}" -PversionCode="${{ steps.version.outputs.code }}"

      - name: Rename APK
        id: apk
        run: |
          OUT="qaidah-for-kids-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE=""
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            NOTE=$'\n\n> ⚠️ This APK is signed with a debug key. Add the signing secrets (see RELEASING.md) before sharing widely.'
          fi
          FILES=("${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # The release was created on GitHub's Releases page: attach the APK to it.
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
            if [ -n "$NOTE" ]; then
              BODY="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
              gh release edit "$GITHUB_REF_NAME" --notes "${BODY}${NOTE}"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "Qaidah for Kids ${GITHUB_REF_NAME}" \
              --generate-notes \
              --notes "Install on an Android tablet: download the APK below, open it, and allow installing from this source.${NOTE}"
          fi
