name: Release

# Three ways to release (see RELEASING.md):
#   1. Actions tab → Release → "Run workflow" on main, enter a version like 1.0.0.
#   2. Releases page → "Draft a new release" with a new tag like v1.0.0 on main.
#   3. Push a tag like v1.0.0 that points at a commit on main.
# Each builds a release APK and attaches it to the GitHub Release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0 (creates tag v1.0.0 on main)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run this workflow on the main branch (choose 'Branch: main' in the Run workflow menu)."
              exit 1
            fi
            VERSION="$(echo "$INPUT_VERSION" | tr -d '[:space:]')"
            VERSION="${VERSION#v}"
            TAG="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG already exists. Choose a higher version."
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          fi

          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error::Version must look like 1.2.3 (each part 0-99). Got: '$VERSION'"
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main. Release from main only (see RELEASING.md)."
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          # versionCode must always increase: 1.2.3 -> 10203
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (versionCode $CODE) from $GITHUB_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync into Android project
        run: npm run android:sync

      - name: Restore signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set. The APK will be signed with a debug key (fine for testing, not for the Play Store)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PversionName="${{ steps.version.outputs.name }}" -PversionCode="${{ steps.version.outputs.code }}"

      - name: Rename APK
        id: apk
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          OUT="qaidah-for-kids-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          NOTE=""
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            NOTE=$'\n\n> ⚠️ This APK is signed with a debug key. Add the signing secrets (see RELEASING.md) before sharing widely.'
          fi
          FILES=("${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The release was created on GitHub's Releases page: attach the APK to it.
            gh release upload "$TAG" "${FILES[@]}" --clobber
            if [ -n "$NOTE" ]; then
              BODY="$(gh release view "$TAG" --json body --jq .body)"
              gh release edit "$TAG" --notes "${BODY}${NOTE}"
            fi
          else
            # Creates the tag on this exact commit if it doesn't exist yet ("Run workflow" button).
            gh release create "$TAG" "${FILES[@]}" \
              --target "$GITHUB_SHA" \
              --title "Qaidah for Kids ${TAG}" \
              --generate-notes \
              --notes "Install on an Android tablet: download the APK below, open it, and allow installing from this source.${NOTE}"
          fi
