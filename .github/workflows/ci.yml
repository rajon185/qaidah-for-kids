name: CI

# Builds a debug APK for every push to develop/main and every pull request,
# so problems are caught before a release is tagged.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: for f in js/*.js sw.js; do node --check "$f"; done

      - name: Build web app and sync into Android project
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PversionName="0.0.0-ci.${{ github.run_number }}" -PversionCode=1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qaidah-for-kids-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
